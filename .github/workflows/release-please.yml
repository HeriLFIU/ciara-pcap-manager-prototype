name: Release Please

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Generate Release PR or Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python

          # Release Please opens its release PR with the default GITHUB_TOKEN,
          # and GitHub deliberately does not fire `pull_request` events for PRs
          # created by that token. The release PR therefore gets NO CI run.
          # To gate releases on CI, create a Personal Access Token (or GitHub
          # App token) with `contents: write` and `pull-requests: write`, store
          # it as the RELEASE_PLEASE_TOKEN secret, and uncomment the line below.
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

          # Only add a line like this if your __init__.py also contains a version number which needs to be bumped.
          # extra-files: |
          #   [
          #     "src/ciara_pcap_manager_prototype/__init__.py"
          #   ]
