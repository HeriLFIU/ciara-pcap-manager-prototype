[project]
name = "ciara-pcap-cli"
version = "0.1.0"
description = "Typer command line interface for the CIARA PCAP analysis platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ciara-pcap-client",
  "ciara-pcap-sdk",
  "rich>=15.0.0",
  "typer>=0.27.2",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
ciara-pcap = "ciara_pcap_cli.__main__:main"

[build-system]
requires = ["uv_build>=0.9.0,<10"]
build-backend = "uv_build"

[tool.uv.sources]
ciara-pcap-client = { workspace = true }
ciara-pcap-sdk = { workspace = true }
