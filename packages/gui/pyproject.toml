[project]
name = "ciara-pcap-gui"
version = "0.1.0"
description = "PySide6 desktop client for the CIARA PCAP analysis platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ciara-pcap-client",
  "ciara-pcap-sdk",
  "pyside6>=6.11.2",
  "qasync>=0.28.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
ciara-pcap-gui = "ciara_pcap_gui.__main__:main"

[build-system]
requires = ["uv_build>=0.9.0,<10"]
build-backend = "uv_build"

[tool.uv.sources]
ciara-pcap-client = { workspace = true }
ciara-pcap-sdk = { workspace = true }
